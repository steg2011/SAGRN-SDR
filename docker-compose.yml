services:
  db:
    image: postgis/postgis:16-3.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sagrn
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: sagrn
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sagrn"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: sagrn-sdr-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379/0
      HOST: "0.0.0.0"
      PORT: "8000"
      WORKERS: "1"
      STATIC_DIR: /app/frontend_build
      CFS_INCIDENTS_XML: ${CFS_INCIDENTS_XML:-https://data.eso.sa.gov.au/prod/cfs/criimson/cfs_current_incidents.xml}
      CFS_CAP_XML: ${CFS_CAP_XML:-https://data.eso.sa.gov.au/prod/cfs/criimson/cfs_cap_incidents.xml}
      MESSAGE_RETENTION_HOURS: ${MESSAGE_RETENTION_HOURS:-8760}
      MAPBOX_TOKEN: ${MAPBOX_TOKEN:-}
      CFS_INCIDENTS_JSON: ${CFS_INCIDENTS_JSON:-https://data.eso.sa.gov.au/prod/cfs/criimson/cfs_current_incidents.json}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  collector:
    build:
      context: .
      dockerfile: collector.Dockerfile
    restart: unless-stopped
    privileged: true
    volumes:
      - /dev/bus/usb:/dev/bus/usb
      - collector_logs:/collector/logs
    environment:
      SAGRN_SERVER_URL: http://backend:8000
      COLLECTOR_ID: ${COLLECTOR_ID:-pager1}
      PAGER_FREQUENCY: ${PAGER_FREQUENCY:-148.8125M}
      PYTHONUNBUFFERED: "1"
      SAGRN_SDR_TIMEOUT: ${SAGRN_SDR_TIMEOUT:-30}
      SAGRN_GAIN: ${SAGRN_GAIN:-49.6}
    depends_on:
      - backend

  admin:
    image: sagrn-sdr-backend
    restart: unless-stopped
    command: ["uvicorn", "app.admin.main:app", "--host", "0.0.0.0", "--port", "8100", "--workers", "1"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_SECRET_KEY: ${ADMIN_SECRET_KEY}
      HOST_PROC: /host/proc
      HOST_SYS: /host/sys
      HOST_DISK_PROBE: /host/hostname
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc/hostname:/host/hostname:ro
      - collector_logs:/collector/logs:ro
    ports:
      - "127.0.0.1:8100:8100"
    depends_on:
      backend:
        condition: service_started
      db:
        condition: service_healthy

  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-chunked-encoding --protocol http2 run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - backend

volumes:
  pgdata:
  collector_logs:
