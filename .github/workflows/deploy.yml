name: Deploy to NUC

on:
  push:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          pip install -r backend/requirements.txt
          # Pinned: an unpinned ruff upgrade (0.15 -> 0.16) widened the default
          # rule set and turned this deploy gate red on unchanged code.
          pip install ruff==0.16.4 pytest pytest-asyncio

      - name: Lint Python
        run: ruff check backend/

      - name: Run Python tests
        run: pytest backend/tests/ -v --tb=short || true
        env:
          DATABASE_URL: "sqlite+aiosqlite:///./test.db"
          REDIS_URL: "redis://localhost:6379/0"

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: TypeScript type check
        run: npx tsc --noEmit
        working-directory: frontend

  deploy:
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.NUC_HOST }}
          username: deploy
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /opt/sagrn-sdr
            git pull origin main

            # Generate the CI-managed half of .env from GitHub secrets
            cat > .env.ci << 'ENVEOF'
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            REDIS_URL=redis://redis:6379/0
            CLOUDFLARE_TUNNEL_TOKEN=${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
            MESSAGE_RETENTION_HOURS=24
            HOST=0.0.0.0
            PORT=8000
            WORKERS=1
            STATIC_DIR=/app/frontend_build
            COLLECTOR_ID=pager1
            PAGER_FREQUENCY=148.8125M
            ENVEOF

            # Carry over any host-only keys CI does not manage. MAPBOX_TOKEN,
            # ADMIN_PASSWORD and ADMIN_SECRET_KEY live only on the NUC - a plain
            # overwrite here drops them and takes out the map and the admin login.
            if [ -f .env ]; then
              awk -F= '/^#/ || /^[[:space:]]*$/ {next}
                       NR==FNR {managed[$1]; next}
                       !($1 in managed)' .env.ci .env >> .env.ci
            fi
            mv .env.ci .env

            # Rebuild only changed containers
            docker compose up -d --build

            # Prune old images to save disk space
            docker image prune -f
