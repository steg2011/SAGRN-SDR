name: CI

on:
  push:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          pip install -r backend/requirements.txt
          # Pinned: an unpinned ruff upgrade (0.15 -> 0.16) widened the default
          # rule set and turned this deploy gate red on unchanged code.
          pip install ruff==0.16.4 pytest pytest-asyncio

      - name: Lint Python
        run: ruff check backend/

      - name: Run Python tests
        run: pytest backend/tests/ -v --tb=short || true
        env:
          DATABASE_URL: "sqlite+aiosqlite:///./test.db"
          REDIS_URL: "redis://localhost:6379/0"

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: TypeScript type check
        run: npx tsc --noEmit
        working-directory: frontend
