<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>SAGRN Admin — Sign in</title>
<style>
  :root {
    --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e;
    --muted: #898781; --line: #e1e0d9; --accent: #2a78d6; --critical: #d03b3b;
    --border: rgba(11,11,11,0.10);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --page: #0d0d0d; --surface: #1a1a19; --ink: #ffffff; --ink-2: #c3c2b7;
      --muted: #898781; --line: #2c2c2a; --accent: #3987e5; --critical: #e66767;
      --border: rgba(255,255,255,0.10);
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--page); color: var(--ink);
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
  }
  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 36px 32px; width: min(360px, 90vw);
  }
  h1 { font-size: 18px; font-weight: 600; margin-bottom: 4px; }
  p.sub { color: var(--ink-2); font-size: 13px; margin-bottom: 24px; }
  label { display: block; font-size: 12px; color: var(--ink-2); margin-bottom: 6px; }
  input[type=password] {
    width: 100%; padding: 10px 12px; font-size: 14px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--page); color: var(--ink);
  }
  input[type=password]:focus { outline: 2px solid var(--accent); border-color: transparent; }
  button {
    width: 100%; margin-top: 16px; padding: 10px; font-size: 14px; font-weight: 600;
    border: none; border-radius: 8px; background: var(--accent); color: #fff; cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: wait; }
  .error { color: var(--critical); font-size: 13px; margin-top: 12px; min-height: 18px; }
</style>
</head>
<body>
  <form class="card" id="form">
    <h1>SAGRN Admin</h1>
    <p class="sub">Server monitoring &amp; site analytics</p>
    <label for="pw">Password</label>
    <input type="password" id="pw" autocomplete="current-password" autofocus required>
    <button type="submit" id="btn">Sign in</button>
    <div class="error" id="err"></div>
  </form>
<script>
document.getElementById('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('btn'), err = document.getElementById('err');
  btn.disabled = true; err.textContent = '';
  try {
    const resp = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: document.getElementById('pw').value })
    });
    if (resp.ok) { window.location.href = '/'; return; }
    const body = await resp.json().catch(() => ({}));
    err.textContent = body.detail || 'Login failed';
  } catch {
    err.textContent = 'Network error';
  }
  btn.disabled = false;
});
</script>
</body>
</html>
